<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
  <script>
    // SPA fallback para GitHub Pages: preserva a rota e recarrega a app na raiz
    var path = window.location.pathname;
    var search = window.location.search;
    if (path && path !== '/' && path !== '/index.html') {
      sessionStorage.setItem('spa-redirect', path + search);
    }
    window.location.replace('/' + search);
  </script>
</head>
<body>
  Redirecionando...
</body>
</html>
