<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' *; script-src 'self' 'unsafe-inline' 'unsafe-eval' *; style-src 'self' 'unsafe-inline' *; img-src 'self' data: blob: *; connect-src *;">
    <title>Conectando Facebook - Vitória News</title>
    <script src="/config.js"></script>
    <script>
        function getSessionToken() {
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
                        try {
                            var parsed = JSON.parse(localStorage.getItem(key));
                            if (parsed && parsed.access_token) return parsed.access_token;
                        } catch (e) {}
                    }
                }
            } catch (e) {}
            return '';
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            var state = urlParams.get('state');
            var errParam = urlParams.get('error');
            var platform = 'facebook';

            if (errParam) {
                document.getElementById('status').innerText = 'Autorização cancelada ou recusada.';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('icon-box').innerText = '⚠️';
                setTimeout(function() { window.close(); }, 3000);
                return;
            }

            var hasOpener = false;
            try { hasOpener = !!window.opener; } catch (e) { hasOpener = false; }

            if (hasOpener) {
                try {
                    window.opener.postMessage({ type: 'oauth-callback', url: window.location.href, platform: platform }, '*');
                } catch (e) {}
                document.getElementById('status').innerText = 'Autorização recebida com sucesso! Concluindo...';
            }

            var closeTimer = setTimeout(function() { window.close(); }, 15000);

            if (code && state && platform && !hasOpener) {
                var isLocal = window.location.origin.indexOf('localhost') !== -1 || window.location.origin.indexOf('127.0.0.1') !== -1;
                var cfg = window.__SUPABASE_CONFIG__ || {};
                var supabaseUrl = isLocal ? (window.location.origin + '/supabase') : (cfg.SUPABASE_URL || 'https://supabase.webradiovitoria.com.br');
                var sessionToken = getSessionToken();
                if (sessionToken) {
                    var redirectUri = window.location.origin + window.location.pathname;
                    fetch(supabaseUrl + '/functions/v1/social-oauth-callback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
                        body: JSON.stringify({ code: code, state: state, platform: platform, redirect_uri: redirectUri })
                    }).then(function(r) { return r.json(); }).then(function(data) {
                        if (data.success) {
                            document.getElementById('status').innerText = 'Conta de Facebook conectada com sucesso!';
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('icon-box').innerText = '✅';
                            clearTimeout(closeTimer);
                            setTimeout(function() { window.close(); }, 2000);
                        } else {
                            document.getElementById('status').innerText = 'Falha ao conectar: ' + (data.error || 'erro desconhecido');
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('icon-box').innerText = '❌';
                        }
                    }).catch(function() {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('icon-box').innerText = '⚠️';
                    });
                } else {
                    document.getElementById('status').innerText = 'Sessão não encontrada. Feche e tente novamente pelo painel.';
                    document.getElementById('loader').style.display = 'none';
                }
            }
        };
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #090d16; 
            color: #f8fafc; 
            text-align: center; 
        }
        .card {
            max-width: 380px;
            width: 90%;
            padding: 36px 28px;
            background: rgba(15, 23, 42, 0.75);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
        }
        .icon-box { 
            font-size: 52px; 
            margin-bottom: 16px;
            line-height: 1;
        }
        h1 { font-size: 22px; margin: 0 0 4px; font-weight: 900; letter-spacing: -0.02em; color: #ffffff; }
        .tagline { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: #38bdf8; margin-bottom: 20px; }
        p { color: #94a3b8; font-size: 13.5px; line-height: 1.5; margin: 0; }
        .loader {
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon-box" class="icon-box">⚡</div>
        <h1>Vitória News</h1>
        <div class="tagline">Rede Vitória de Comunicação</div>
        <p id="status">Sincronizando autorização de Facebook com o seu painel...</p>
        <div id="loader" class="loader"></div>
    </div>
</body>
</html>
