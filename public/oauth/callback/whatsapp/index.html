<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ghtkdkauseesambzqfrd.supabase.co; font-src 'self'; frame-src 'self';">
    <title>Conectando WhatsApp - Vitória Net</title>
    <script>
        // 🔹 Página de callback (ponte)
        // - SEMPRE repassa a URL com code/state para o painel via postMessage.
        //   O painel (local ou produção) é quem troca o code → evita dupla troca.
        // - Só troca o code aqui se NÃO houver opener (fallback), usando o
        //   access_token da sessão real do domínio (nunca a anonKey).
        function getSessionToken() {
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
                        try {
                            var parsed = JSON.parse(localStorage.getItem(key));
                            if (parsed && parsed.access_token) return parsed.access_token;
                        } catch (e) {}
                    }
                }
            } catch (e) {}
            return '';
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            var state = urlParams.get('state');
            var errParam = urlParams.get('error');
            var pathParts = window.location.pathname.split('/').filter(Boolean);
            var platform = pathParts.length >= 3 ? pathParts[2] : '';

            if (errParam) {
                document.getElementById('status').innerText = 'Autorização cancelada ou recusada.';
                document.getElementById('loader').style.display = 'none';
                setTimeout(function() { window.close(); }, 2000);
                return;
            }

            var hasOpener = false;
            try { hasOpener = !!window.opener; } catch (e) { hasOpener = false; }

            if (hasOpener) {
                // O painel (mesmo origin ou localhost) recebe a URL e troca o code
                try {
                    window.opener.postMessage({ type: 'oauth-callback', url: window.location.href }, '*');
                } catch (e) {}
                document.getElementById('status').innerText = 'Autorização concluída! Esta janela fechará em instantes.';
            }

            var closeTimer = setTimeout(function() { window.close(); }, 15000);

            // Fallback: popup aberta sem opener — troca aqui com a sessão real
            if (code && state && platform && !hasOpener) {
                var supabaseUrl = 'https://ghtkdkauseesambzqfrd.supabase.co';
                var sessionToken = getSessionToken();
                if (sessionToken) {
                    var redirectUri = window.location.origin + window.location.pathname;
                    fetch(supabaseUrl + '/functions/v1/social-oauth-callback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
                        body: JSON.stringify({ code: code, state: state, platform: platform, redirect_uri: redirectUri })
                    }).then(function(r) { return r.json(); }).then(function(data) {
                        if (data.success) {
                            document.getElementById('status').innerText = 'Conta conectada com sucesso!';
                            document.getElementById('loader').style.display = 'none';
                            clearTimeout(closeTimer);
                            setTimeout(function() { window.close(); }, 2000);
                        } else {
                            document.getElementById('status').innerText = 'Falha ao finalizar: ' + (data.error || 'erro desconhecido');
                            document.getElementById('loader').style.display = 'none';
                        }
                    }).catch(function() {
                        document.getElementById('loader').style.display = 'none';
                    });
                } else {
                    document.getElementById('status').innerText = 'Sessão não encontrada. Feche e tente novamente pelo painel.';
                    document.getElementById('loader').style.display = 'none';
                }
            }
        };
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #0f172a; 
            color: white; 
            text-align: center; 
        }
        .container {
            max-width: 400px;
            padding: 40px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .success-icon { 
            font-size: 64px; 
            color: #22c55e; 
            margin-bottom: 24px;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        h1 { font-size: 20px; margin: 0 0 12px; font-weight: 700; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Vitória Net</h1>
        <p id="status">Sincronizando autorização com o seu painel...</p>
        <div id="loader" class="loader"></div>
    </div>
</body>
</html>
