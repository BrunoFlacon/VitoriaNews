<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando Instagram - Vitória News</title>
    <script src="/config.js"></script>
    <script>
        var CORRECT_SUPABASE_HOST = 'supabase.webradiovitoria.com.br';
        var OLD_SUPABASE_HOSTS = ['ghtkdkauseesambzqfrd', 'yttsmficdfnbvvuhhdmw'];

        function clearStaleSessions() {
            try {
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
                        if (OLD_SUPABASE_HOSTS.some(function(h) { return key.indexOf(h) !== -1; })) {
                            localStorage.removeItem(key);
                        }
                    }
                }
            } catch (e) {}
        }

        function getSessionToken() {
            clearStaleSessions();
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
                        if (OLD_SUPABASE_HOSTS.some(function(h) { return key.indexOf(h) !== -1; })) continue;
                        try {
                            var parsed = JSON.parse(localStorage.getItem(key));
                            if (parsed && parsed.access_token) return parsed.access_token;
                        } catch (e) {}
                    }
                }
            } catch (e) {}
            return '';
        }

        function showError(msg) {
            document.getElementById('status').innerText = msg;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('icon-box').innerText = '❌';
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            var state = urlParams.get('state');
            var errParam = urlParams.get('error');
            var platform = 'instagram';

            if (errParam) {
                document.getElementById('status').innerText = 'Autorização cancelada ou recusada.';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('icon-box').innerText = '⚠️';
                setTimeout(function() { window.close(); }, 3000);
                return;
            }

            var hasOpener = false;
            try { hasOpener = !!window.opener; } catch (e) { hasOpener = false; }

            if (hasOpener) {
                try {
                    window.opener.postMessage({ type: 'oauth-callback', url: window.location.href, platform: platform }, '*');
                } catch (e) {}
                document.getElementById('status').innerText = 'Autorização recebida com sucesso! Concluindo...';
            }

            var closeTimer = setTimeout(function() { window.close(); }, 15000);

            if (code && state && platform && !hasOpener) {
                var isLocal = window.location.origin.indexOf('localhost') !== -1 || window.location.origin.indexOf('127.0.0.1') !== -1;
                var cfg = window.__SUPABASE_CONFIG__ || {};
                var supabaseUrl = cfg.SUPABASE_URL || 'https://supabase.webradiovitoria.com.br';
                if (isLocal) supabaseUrl = window.location.origin + '/supabase';
                if (supabaseUrl && OLD_SUPABASE_HOSTS.some(function(h) { return supabaseUrl.indexOf(h) !== -1; })) {
                    supabaseUrl = 'https://' + CORRECT_SUPABASE_HOST;
                }
                var sessionToken = getSessionToken();
                if (sessionToken) {
                    var redirectUri = window.location.origin + window.location.pathname;
                    fetch(supabaseUrl + '/functions/v1/social-oauth-callback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
                        body: JSON.stringify({ code: code, state: state, platform: platform, redirect_uri: redirectUri })
                    }).then(function(r) { return r.json(); }).then(function(data) {
                        if (data.success) {
                            document.getElementById('status').innerText = 'Conta de Instagram conectada com sucesso!';
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('icon-box').innerText = '✅';
                            clearTimeout(closeTimer);
                            setTimeout(function() { window.close(); }, 2000);
                        } else {
                            showError('Falha ao conectar: ' + (data.error || 'erro desconhecido'));
                        }
                    }).catch(function(err) {
                        showError('Erro de conexão: ' + (err.message || 'Verifique sua internet e tente novamente.'));
                    });
                } else {
                    showError('Sessão não encontrada. Faça login novamente no painel e tente conectar.');
                }
            }
        };
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #090d16; 
            color: #f8fafc; 
            text-align: center; 
        }
        .card {
            max-width: 380px;
            width: 90%;
            padding: 36px 28px;
            background: rgba(15, 23, 42, 0.75);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
        }
        .icon-box { 
            font-size: 52px; 
            margin-bottom: 16px;
            line-height: 1;
        }
        h1 { font-size: 22px; margin: 0 0 4px; font-weight: 900; letter-spacing: -0.02em; color: #ffffff; }
        .tagline { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: #38bdf8; margin-bottom: 20px; }
        p { color: #94a3b8; font-size: 13.5px; line-height: 1.5; margin: 0; }
        .loader {
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon-box" class="icon-box">⚡</div>
        <h1>Vitória News</h1>
        <div class="tagline">Rede Vitória de Comunicação</div>
        <p id="status">Sincronizando autorização de Instagram com o seu painel...</p>
        <div id="loader" class="loader"></div>
    </div>
</body>
</html>
